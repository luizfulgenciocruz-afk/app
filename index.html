<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu-Suíço Foods — Sistema Integrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #C8202B;
    --red-dark: #8E141C;
    --paper: #F8F9FA;
    --ink: #111111;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--ink);
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    position: relative;
  }

  .logo-container {
    width: 140px; height: 140px; border-radius: 50%;
    background: #FFF; padding: 6px; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(250, 250, 250, 0.15);
  }
  .logo-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  h1 { font-family: 'Fraunces', serif; font-size: 36px; margin-bottom: 8px; }
  p { color: #AAA; font-size: 16px; margin-bottom: 36px; }

  .hub-grid {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: min(420px, 100%);
  }

  .hub-card {
    background: linear-gradient(135deg, #222 0%, #181818 100%);
    border: 2px solid #333;
    color: #FFF;
    text-decoration: none;
    padding: 22px;
    border-radius: 18px;
    font-size: 19px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }

  .hub-card:hover, .hub-card:active {
    border-color: var(--red);
    background: var(--red);
    transform: translateY(-2px);
  }

  .hub-card.admin-btn { border-color: #444; }
  .hub-card span { font-size: 22px; }

  /* MODAL DE NAVEGAÇÃO DA ADMINISTRAÇÃO */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }

  .modal-card {
    background: #1B1B1B;
    border: 2px solid var(--red);
    border-radius: 24px;
    padding: 28px 24px;
    width: min(400px, 100%);
    box-shadow: 0 10px 32px rgba(200, 32, 43, 0.3);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-title { font-family: 'Fraunces', serif; font-size: 24px; color: #FFF; margin-bottom: 4px; }
  .modal-sub { font-size: 14px; color: #AAA; margin-bottom: 12px; }

  .admin-menu-btn {
    background: #282828;
    border: 1.5px solid #444;
    color: #FFF;
    text-decoration: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
  }
  .admin-menu-btn:hover, .admin-menu-btn:active {
    background: var(--red);
    border-color: var(--red);
  }

  .close-modal-btn {
    background: transparent;
    border: none;
    color: #888;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    text-decoration: underline;
  }
  .close-modal-btn:hover { color: #FFF; }
</style>
</head>
<body>

<div class="logo-container">
  <img src="logo.jpg" alt="Logo">
</div>

<h1>Meu-Suíço Foods</h1>
<p>Selecione o tipo de acesso:</p>

<div class="hub-grid">
  <!-- BOTÃO DO CLIENTE (ENTRA EM TELA CHEIA NA HORA) -->
  <button onclick="openClientTablet()" class="hub-card">
    <span>📱 Tablet do Cliente</span> ➔
  </button>

  <!-- BOTÃO ADMINISTRADOR (EXIGE SENHA 9963) -->
  <button onclick="openAdminArea()" class="hub-card admin-btn">
    <span>🔐 Área Administrativa</span> ➔
  </button>
</div>

<!-- MODAL COM MÓDULOS DA ADMINISTRAÇÃO -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-card">
    <div class="modal-title">Painel de Controle</div>
    <div class="modal-sub">Selecione o módulo que deseja acessar:</div>

    <a href="cozinha.html" class="admin-menu-btn">
      <span>👨‍🍳 Tela da Cozinha</span> ➔
    </a>
    <a href="painel.html" class="admin-menu-btn">
      <span>📺 Painel de Senhas</span> ➔
    </a>
    <a href="relatorio.html" class="admin-menu-btn">
      <span>📊 Relatório de Vendas</span> ➔
    </a>

    <button class="close-modal-btn" onclick="closeAdminArea()">✕ Fechar Menu</button>
  </div>
</div>

<script>
function openClientTablet() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
  setTimeout(() => {
    window.location.href = "cliente.html";
  }, 150);
}

function openAdminArea() {
  const pass = prompt("Acesso Restrito. Digite a senha administrativa:");
  if (pass === "9963") {
    document.getElementById('adminModal').classList.add('show');
  } else if (pass !== null) {
    alert("Senha incorreta! Acesso negado.");
  }
}

function closeAdminArea() {
  document.getElementById('adminModal').classList.remove('show');
}
</script>

</body>
</html>
