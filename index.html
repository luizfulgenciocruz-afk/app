<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu-Suíço Foods — Sistema Integrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #C8202B;
    --red-dark: #8E141C;
    --paper: #F8F9FA;
    --ink: #111111;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--ink);
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  .logo-container {
    width: 140px; height: 140px; border-radius: 50%;
    background: #FFF; padding: 6px; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(250, 250, 250, 0.15);
  }
  .logo-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  h1 { font-family: 'Fraunces', serif; font-size: 36px; margin-bottom: 8px; }
  p { color: #AAA; font-size: 16px; margin-bottom: 36px; }

  .hub-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(400px, 100%);
  }

  .hub-card {
    background: linear-gradient(135deg, #222 0%, #181818 100%);
    border: 2px solid #333;
    color: #FFF;
    text-decoration: none;
    padding: 20px;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
  }

  .hub-card:hover, .hub-card:active {
    border-color: var(--red);
    background: var(--red);
    transform: translateY(-2px);
  }

  .hub-card span { font-size: 24px; }
</style>
</head>
<body>

<div class="logo-container">
  <img src="logo.jpg" alt="Logo">
</div>

<h1>Meu-Suíço Foods</h1>
<p>Selecione o ambiente que deseja acessar:</p>

<div class="hub-grid">
  <a href="cliente.html" class="hub-card">
    <span>📱 Tablet do Cliente</span> ➔
  </a>
  <a href="cozinha.html" class="hub-card">
    <span>👨‍🍳 Tela da Cozinha</span> ➔
  </a>
  <a href="painel.html" class="hub-card">
    <span>📺 Painel de Senhas</span> ➔
  </a>
  <a href="relatorio.html" class="hub-card" style="border-color: #555;">
    <span>📊 Relatório de Vendas</span> ➔
  </a>
</div>

</body>
</html>
