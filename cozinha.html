<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu-Suíço Foods — Painel da Cozinha</title>

<!-- PREVENÇÃO DE CACHE NATIVA -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
  :root {
    --bg: #121212;
    --card-bg: #1E1E1E;
    --red: #C8202B;
    --green: #2E7D32;
    --blue: #0288D1;
    --white: #FFFFFF;
    --grey: #888888;
    --line: #333333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    padding: 20px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--line);
    margin-bottom: 24px;
  }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; }
  .grid-orders {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .order-card {
    background: var(--card-bg);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .order-card.ready {
    border-color: var(--green);
    opacity: 0.75;
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .order-senha {
    font-size: 32px;
    font-weight: 800;
    color: var(--red);
  }
  .order-time { font-size: 14px; color: var(--grey); }
  .order-items { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .order-item-row { font-size: 17px; font-weight: 700; }
  .order-notes {
    background: rgba(200,32,43,0.15);
    border-left: 3px solid var(--red);
    padding: 8px 12px;
    font-size: 13.5px;
    border-radius: 4px;
    color: #FFAAAA;
  }
  .actions-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
  }
  .action-btn {
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-call { background: var(--blue); color: var(--white); }
  .btn-done { background: var(--green); color: var(--white); }
  .btn-undo { background: #444; color: var(--white); }
</style>
</head>
<body>

<header>
  <h1>👨‍🍳 Cozinha — Meu-Suíço Foods</h1>
  <div id="clock" style="font-weight:700; color:var(--grey); font-size: 18px;">--:--</div>
</header>

<div class="grid-orders" id="ordersGrid"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCQxr8EkaR0bwdvX9KjZXbDshTo9B9jn24",
  authDomain: "meu-su.firebaseapp.com",
  databaseURL: "https://meu-su-default-rtdb.firebaseio.com",
  projectId: "meu-su",
  storageBucket: "meu-su.firebasestorage.app",
  messagingSenderId: "123781955468",
  appId: "1:123781955468:web:f4fd0a2824c43b48d9e0a9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function updateClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();

db.ref('orders').on('value', snapshot => {
  const data = snapshot.val() || {};
  const grid = document.getElementById('ordersGrid');
  const list = Object.values(data).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  grid.innerHTML = list.map(order => `
    <div class="order-card ${order.status === 'pronto' ? 'ready' : ''}">
      <div class="order-header">
        <span class="order-senha">#${order.senha}</span>
        <span class="order-time">${new Date(order.createdAt).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <ul class="order-items">
        ${order.items.map(i => `<li class="order-item-row">${i.qty}x ${i.name}</li>`).join('')}
      </ul>
      ${order.notes ? `<div class="order-notes">OBS: ${order.notes}</div>` : ''}
      
      <div class="actions-container">
        <button class="action-btn btn-call" onclick="chamarSenha('${order.senha}')">📣 Chamar no Painel</button>
        
        ${order.status === 'pronto'
          ? `<button class="action-btn btn-undo" onclick="setStatus('${order.id}', 'preparo')">↩ Reabrir Pedido</button>`
          : `<button class="action-btn btn-done" onclick="setStatus('${order.id}', 'pronto')">✓ Marcar como Pronto</button>`
        }
      </div>
    </div>
  `).join('');
});

function setStatus(id, status){
  db.ref(`orders/${id}`).update({ status: status });
}

function chamarSenha(senha){
  // Grava a senha chamada com timestamp único para forçar o disparo no Painel
  db.ref('last_called_senha').set({
    senha: senha,
    calledAt: Date.now()
  });
}
</script>
</body>
</html>
