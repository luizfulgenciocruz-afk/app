<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu-Suíço Foods — Painel de Chamada</title>

<!-- PREVENÇÃO DE CACHE NATIVA -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Inter:wght@700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
  :root {
    --bg: #C8202B;
    --paper: #FFFFFF;
    --ink: #241F1D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    user-select: none;
  }
  
  /* OVERLAY PARA LIBERAR SOM DO NAVEGADOR */
  .audio-unlock-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;
  }
  .unlock-btn {
    background: var(--paper); color: var(--bg); border: none; padding: 24px 48px;
    font-size: 26px; font-weight: 900; border-radius: 20px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .label { font-size: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; opacity: 0.95; }
  .number-display {
    font-family: 'Fraunces', serif;
    font-size: 280px;
    font-weight: 800;
    line-height: 1;
    margin: 20px 0;
    background: var(--paper);
    color: var(--bg);
    padding: 20px 80px;
    border-radius: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    transition: transform 0.2s ease;
  }
  .number-display.pulse {
    transform: scale(1.08);
  }

  .history-box {
    margin-top: 30px;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .history-title { font-size: 22px; opacity: 0.85; }
  .history-item { font-size: 32px; font-weight: 800; background: rgba(255,255,255,0.25); padding: 10px 24px; border-radius: 14px; }
</style>
</head>
<body>

<div class="audio-unlock-overlay" id="unlockOverlay">
  <h1 style="color:#FFF; font-size: 36px;">Meu-Suíço Foods</h1>
  <button class="unlock-btn" id="unlockBtn">🔔 CLIQUE AQUI PARA ATIVAR O SOM DO PAINEL</button>
</div>

<div class="label">SENHA CHAMADA</div>
<div class="number-display" id="currentSenha">--</div>

<div class="history-box">
  <span class="history-title">Anteriores:</span>
  <div id="historyList" style="display:flex; gap:14px;"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCQxr8EkaR0bwdvX9KjZXbDshTo9B9jn24",
  authDomain: "meu-su.firebaseapp.com",
  databaseURL: "https://meu-su-default-rtdb.firebaseio.com",
  projectId: "meu-su",
  storageBucket: "meu-su.firebasestorage.app",
  messagingSenderId: "123781955468",
  appId: "1:123781955468:web:f4fd0a2824c43b48d9e0a9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let history = [];
let audioUnlocked = false;

// Libera a permissão de áudio do Chrome/Edge no primeiro clique
document.getElementById('unlockBtn').onclick = () => {
  audioUnlocked = true;
  document.getElementById('unlockOverlay').style.display = 'none';
  playBeep();
};

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.6, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

function speakSenha(senha) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(`Senha ${senha}`);
    utterance.lang = 'pt-BR';
    utterance.rate = 0.95;
    window.speechSynthesis.speak(utterance);
  }
}

let lastCallTimestamp = 0;

db.ref('last_called_senha').on('value', snapshot => {
  const data = snapshot.val();
  if (!data || !data.senha) return;

  // Garante que só chame se for um novo clique na cozinha
  if (data.calledAt && data.calledAt !== lastCallTimestamp) {
    lastCallTimestamp = data.calledAt;
    const senha = data.senha;

    const display = document.getElementById('currentSenha');
    display.textContent = senha;
    
    // Efeito visual no número
    display.classList.add('pulse');
    setTimeout(() => display.classList.remove('pulse'), 300);

    // Adiciona ao histórico de senhas anteriores
    if (history[0] !== senha) {
      history.unshift(senha);
      if (history.length > 4) history.pop();
      renderHistory();
    }

    // Toca som e voz
    if (audioUnlocked) {
      playBeep();
      setTimeout(() => speakSenha(senha), 600);
    }
  }
});

function renderHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = history.slice(1).map(s => `<div class="history-item">#${s}</div>`).join('');
}
</script>
</body>
</html>
